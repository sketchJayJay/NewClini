services:
  newclinica:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DB_PATH: ${DB_PATH:-/data/newclinica.db}
      CLINIC_NAME: ${CLINIC_NAME:-NewClínica Odonto}
      FINANCE_PASSWORD: ${FINANCE_PASSWORD:-sorrisonew}
    volumes:
      - newclinica-data:/data
    expose:
      - "8000"

volumes:
  newclinica-data:
